    sections:
      - type: grid
        cards:
          - type: heading
            heading: eBUS — дополнительный канал
            heading_style: title
            grid_options:
              columns: full
          - type: tile
            entity: >-
              sensor.kontroller_otopleniia_nikas_h2000_pro_nikas_h2000_pro_ebus_osnovnoi_no2_davlenie_tn
            name: Давление котла №2
            grid_options:
              columns: 6
          - type: tile
            entity: >-
              sensor.kontroller_otopleniia_nikas_h2000_pro_nikas_h2000_pro_ebus_osnovnoi_no2_moduliatsiia
            name: Модуляция №2
            grid_options:
              columns: 6
          - type: tile
            entity: >-
              sensor.kontroller_otopleniia_nikas_h2000_pro_nikas_h2000_pro_ebus_osnovnoi_no2_tdeg_vne_doma
            name: Улица eBUS №2
            grid_options:
              columns: 6
          - type: tile
            entity: >-
              sensor.kontroller_otopleniia_nikas_h2000_pro_nikas_h2000_pro_ebus_osnovnoi_no2_tdeg_gvs

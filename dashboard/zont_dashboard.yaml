            grid_options:
              columns: 6
          - type: tile
            entity: sensor.nikas_h2000_pro_detskaia_1_tdeg_rssi
            name: RSSI датчика °C
            grid_options:
              columns: 6
      - type: grid
        cards:
          - type: heading
            heading: Детская 2
            heading_style: title
            grid_options:
              columns: full
          - type: tile
            entity: sensor.nikas_h2000_pro_detskaia_2
            name: Детская 2
            grid_options:
              columns: 6
          - type: tile
            entity: sensor.nikas_h2000_pro_detskaia_2_tdeg_2
            name: Температура
            grid_options:
              columns: 6
          - type: tile
            entity: sensor.nikas_h2000_pro_detskaia_2_battery
            name: Батарея
            grid_options:
              columns: 6
          - type: tile
            entity: sensor.nikas_h2000_pro_detskaia_2_tdeg_battery
            name: Батарея датчика °C
            grid_options:
              columns: 6
          - type: tile
            entity: sensor.nikas_h2000_pro_detskaia_2_rssi
            name: RSSI
            grid_options:
              columns: 6
          - type: tile
            entity: sensor.nikas_h2000_pro_detskaia_2_tdeg_rssi_2
            name: RSSI датчика °C
            grid_options:
              columns: 6
      - type: grid
        cards:
          - type: heading
            heading: Улица и погода
            heading_style: title
            grid_options:
              columns: full
          - type: tile
            entity: sensor.nikas_h2000_pro_ulichnyi_datchik_2
            name: Уличный датчик
            grid_options:
              columns: 6
          - type: tile
            entity: sensor.nikas_h2000_pro_pogoda_iz_interneta_2

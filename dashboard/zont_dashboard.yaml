            grid_options:
              columns: 6
          - type: tile
            entity: sensor.nikas_h2000_pro_ulichnyi_datchik_rssi_2
            name: RSSI уличного датчика
            grid_options:
              columns: 6
          - chart_type: line
            period: day
            type: statistics-graph
            entities:
              - entity: sensor.nikas_h2000_pro_ebus_osnovnoi_tdeg_vne_doma
                name: eBUS улица
              - entity: sensor.nikas_h2000_pro_ulichnyi_datchik
                name: Уличный датчик
              - entity: sensor.nikas_h2000_pro_pogoda_iz_interneta

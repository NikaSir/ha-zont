  - type: sections
    title: Состояние
    path: heating-status
    icon: mdi:heart-pulse
    max_columns: 4
    sections:
      - type: grid
        cards:
          - type: heading
            heading: Контроллер
            heading_style: title
            grid_options:
              columns: full
          - type: tile
            entity: binary_sensor.nikas_h2000_pro_online

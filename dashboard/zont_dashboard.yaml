            name: Детская 1
            grid_options:
              columns: 6
          - type: tile
            entity: sensor.nikas_h2000_pro_detskaia_1_tdeg_2
            name: Температура
            grid_options:
              columns: 6
          - type: tile
            entity: sensor.nikas_h2000_pro_detskaia_1_battery
            name: Батарея
            grid_options:
              columns: 6
          - type: tile
            entity: sensor.nikas_h2000_pro_detskaia_1_tdeg_battery

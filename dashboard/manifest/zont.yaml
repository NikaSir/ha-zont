api_version: zont.local/panel-manifest/v1
kind: PanelManifest
metadata:
  id: zont
  title: Отопление
  version: 0.9.4
  description: Standalone ZONT heating and DHW panel owned and registered by zont_local.
spec:
  frontend_url_path: dashboard-zont
  webcomponent_name: zont-local-panel
  sidebar_title: Отопление
  sidebar_icon: mdi:pump
  parent:
    id: house.heating
    title: Отопление и ГВС
    path: /dashboard-house-v11/home
  source:
    kind: entity_registry
    platforms:
      - zont
      - zont_ha
    include_disabled: false
  tabs:
    - id: states
      label: Состояние
      icon: mdi:pump
    - id: boilers
      label: Котлы
      icon: mdi:water-boiler
    - id: heating
      label: Отопление
      icon: mdi:radiator
    - id: sensors
      label: Датчики
      icon: mdi:home-thermometer-outline
    - id: diagnostics
      label: Диагностика
      icon: mdi:heart-pulse

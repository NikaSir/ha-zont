name: Integration validation

on:
  push:
    branches:
      - main
      - "release/**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ui:
    name: UI syntax and version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - name: Check frontend module syntax
        run: node --input-type=module --check < custom_components/zont_local/frontend/zont-ui.js
      - name: Check frontend semantic states
        run: node tests/test_zont_ui_semantics.cjs
      - name: Check release version synchronization
        run: |
          grep -F 'VERSION = "0.8.12"' custom_components/zont_local/const.py
          grep -F '"version": "0.8.12"' custom_components/zont_local/manifest.json
          grep -F 'version: 0.8.12' dashboard/manifest/zont.yaml

  hassfest:
    name: Hassfest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: home-assistant/actions/hassfest@master

  hacs:
    name: HACS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: hacs/action@main
        with:
          category: integration
          # This project is distributed as a custom repository; GitHub topics are metadata only.
          ignore: topics
